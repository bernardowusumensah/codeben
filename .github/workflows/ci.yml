name: CI - Build and Promote

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

permissions:
  contents: write

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true 
          driver: docker-container

  


  promote:
    name: Promote Development to Main
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Development
      uses: actions/checkout@v4
      with:
        ref: development
        fetch-depth: 0

    - name: Promote to Main
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch origin main

        git checkout main

        git merge development --ff-only

        git push origin main

  deploy:
    name: Deploy to EC2
    needs: promote
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.SSH_DOCKER_USERNAME}}
          password: ${{ secrets.SSH_DOCKER_PRIVATE_KEY }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.SSH_DOCKER_USERNAME }}/codeben:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.SSH_DOCKER_USERNAME }}/codeben:latest
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deploying application..."

            cd /var/www/codeben

            docker pull ${{ secrets.SSH_DOCKER_USERNAME }}/codeben:latest
            docker stop codeben || true
            docker rm codeben || true
            docker run -d --name codeben -p 80:80 ${{ secrets.SSH_DOCKER_USERNAME }}/codeben:latests