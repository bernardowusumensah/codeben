name: CI - Build and Promote

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

permissions:
  contents: write

jobs:

  # ==========================================
  # 1. CI
  # ==========================================
  ci:
    name: Build
    runs-on: ubuntu-latest

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build


  # ==========================================
  # 2. Promote development → main
  # ==========================================
  promote:
    name: Promote Development to Main
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Promote to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          git checkout main

          git merge development --ff-only

          git push origin main


  # ==========================================
  # 3. Build Docker image and deploy to EC2
  # ==========================================
  deploy:
    name: Build Docker Image and Deploy to EC2
    needs: promote
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main

      # --------------------------------------
      # Login to Docker Hub
      # --------------------------------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # --------------------------------------
      # Build Docker image
      # --------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/codeben:latest .

      # --------------------------------------
      # Push image to Docker Hub
      # --------------------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/codeben:latest

      # --------------------------------------
      # Deploy to EC2
      # --------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            echo "Deploying application..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/codeben:latest

            docker stop codeben || true

            docker rm codeben || true

            docker run -d \
              --name codeben \
              -p 80:3000 \
              ${{ secrets.DOCKER_USERNAME }}/codeben:latest

            docker ps